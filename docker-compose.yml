version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: qa_analytics_db
    environment:
      POSTGRES_USER: qa_admin
      POSTGRES_PASSWORD: secure_password_change_me
      POSTGRES_DB: qa_analytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qa_network

  # Python Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qa_analytics_backend
    environment:
      DATABASE_URL: postgresql://qa_admin:secure_password_change_me@postgres:5432/qa_analytics
      FLASK_ENV: production
      FLASK_APP: app.py
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app.py:/app/app.py
      - ./requirements.txt:/app/requirements.txt
    networks:
      - qa_network
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: qa_analytics_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - qa_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  qa_network:
    driver: bridge
